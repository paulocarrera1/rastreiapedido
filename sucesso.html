<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Aprovado – RastreiaPedido</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: #0A0A0F; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  background: #F7F5F0; border-radius: 28px; padding: 48px 36px;
  max-width: 420px; width: 100%; text-align: center;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}
.icon { font-size: 64px; margin-bottom: 20px; animation: pop 0.5s ease; }
@keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
h1 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #0A0A0F; margin-bottom: 10px; }
p { font-size: 14px; color: #6B6B7B; line-height: 1.6; margin-bottom: 28px; }
.badge {
  background: #EDF7F2; border: 1px solid #A8D8BC;
  border-radius: 12px; padding: 16px; margin-bottom: 28px;
  font-size: 13px; color: #2D7A4F; font-weight: 600; line-height: 1.5;
}
.badge strong { display: block; font-size: 16px; margin-bottom: 4px; }
.btn {
  display: block; width: 100%; padding: 16px;
  background: #0A0A0F; color: #F7F5F0;
  border: none; border-radius: 14px;
  font-family: 'Bebas Neue', sans-serif; font-size: 18px;
  cursor: pointer; text-decoration: none; letter-spacing: 0.5px;
  transition: all 0.2s;
}
.btn:hover { background: #C8832A; }
.spin { display: inline-block; animation: rot 1s linear infinite; }
@keyframes rot { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon">⏳</div>
  <h1>Ativando plano…</h1>
  <p>Aguarde enquanto liberamos seu acesso premium.</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const DB_URL = 'https://rastreia-pedido-default-rtdb.firebaseio.com';
  const params = new URLSearchParams(window.location.search);
  const slug   = params.get('loja');
  const status = params.get('status');

  const app = initializeApp({ databaseURL: DB_URL }, 'sucesso-' + Date.now());
  const db  = getDatabase(app);

  async function ativar() {
    if (!slug || status !== 'approved') {
      document.getElementById('card').innerHTML = `
        <div class="icon">❌</div>
        <h1>Pagamento não confirmado</h1>
        <p>Houve um problema. Tente novamente.</p>
        <a class="btn" href="index.html">Voltar ao início</a>`;
      return;
    }

    // Busca nome da loja
    const snap = await get(ref(db, `lojas/${slug}/nome`));
    const nomeLoja = snap.exists() ? snap.val() : slug;

    // Ativa plano por 30 dias
    const agora     = new Date();
    const expiracao = new Date(agora.getTime() + 30 * 24 * 60 * 60 * 1000);

    await set(ref(db, `lojas/${slug}/plano`), {
      ativo: true,
      tipo: 'premium',
      ativadoEm: agora.toISOString(),
      expiraEm: expiracao.toISOString(),
      valor: 9.90
    });

    document.getElementById('card').innerHTML = `
      <div class="icon">🎉</div>
      <h1>Plano Ativado!</h1>
      <p>Seu painel está sem anúncios pelos próximos 30 dias.</p>
      <div class="badge">
        <strong>✅ Premium ativo — ${nomeLoja}</strong>
        Válido até ${expiracao.toLocaleDateString('pt-BR')}
      </div>
      <a class="btn" href="loja.html?loja=${slug}">Ir para meu painel →</a>`;
  }

  ativar();
</script>
</body>
</html>
